name: Bump Asset Versions

on:
  push:
    branches: [main]
    paths:
      - 'style.css'

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Minify style.css into style.min.css
        run: npx clean-css-cli style.css -o style.min.css

      - name: Commit style.min.css
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add style.min.css
          git diff --staged --quiet || git commit -m "Auto-minify style.css"
          git push