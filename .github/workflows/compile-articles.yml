name: Compile Articles

on:
  push:
    branches: [main]
    paths:
      - 'content/articles/**'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile articles.json
        run: node scripts/compile-articles.js

      - name: Commit updated data/articles.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          git diff --staged --quiet || git commit -m "Auto-compile articles.json"
          git push