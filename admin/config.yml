backend:
  name: github
  repo: bangukwetu/bangu-kwetu
  branch: main
  base_url: https://sveltia-cms-auth.bangukwetu.workers.dev

media_folder: images
public_folder: /images

media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 82

collections:
  - name: articles
    label: Articles
    folder: content/articles
    create: true
    extension: json
    format: json
    slug: "{{fields.id}}"
    sortable_fields: [date, updated, title]
    view_filters:
      - { label: Breaking, field: breaking, pattern: true }
      - { label: Featured, field: featured, pattern: true }
      - { label: Sponsored, field: sponsored, pattern: true }
    view_groups:
      - { label: Category, field: category }
    summary: "{{title}} — {{category}} · {{date}}"
    fields:
      - { label: ID, name: id, widget: string, hint: "Unique, e.g. news-004, no spaces. This becomes the filename — set it once and don't change it later." }
      - { label: Title, name: title, widget: string, pattern: ['^.{1,80}$', "Keep titles under 80 characters so they don't wrap awkwardly on cards."] }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "YYYY-MM-DD", time_format: "HH:mm", picker_utc: false, hint: "Tap to pick the publish date and time — this is your local Nairobi time, not UTC." }
      - { label: Last Updated, name: updated, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "YYYY-MM-DD", time_format: "HH:mm", picker_utc: false, required: false, hint: "Only set this if you edit the article after publishing (your local Nairobi time). Leave blank otherwise." }
      - { label: Category, name: category, widget: select, options: [news, sports, business, nairobi] }
      - { label: Image, name: image, widget: image }
      - { label: Excerpt, name: desc, widget: text, required: false, pattern: ['^.{0,160}$', "Keep excerpts under 160 characters — this is also used as the search-preview and social-share description, and longer text gets cut off on WhatsApp/Google anyway."], hint: "Also used as the search-preview and social-share description for this article." }
      - { label: Body, name: content, widget: markdown, required: false }
      - { label: Breaking News, name: breaking, widget: boolean, default: false }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Sponsored, name: sponsored, widget: boolean, default: false }

  - name: shujaa
    label: Shujaa wa Siku
    files:
      - name: shujaa
        label: All Shujaa
        file: data/shujaa.json
        fields:
          - label: Shujaa
            name: shujaa
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Description, name: desc, widget: text }
              - { label: Full Story, name: story, widget: markdown, required: false }
              - { label: Photo, name: photo, widget: image, required: false }
              - { label: Link, name: link, widget: string, default: shujaa.html }